services:
  hummingbot-local:
    container_name: hummingbot-local
    image: hummingbot-local:latest
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      # Config and data only (no code mount to preserve Cython .so files)
      - ./conf:/home/hummingbot/conf
      - ./logs:/home/hummingbot/logs
      - ./data:/home/hummingbot/data
      - ./certs:/home/hummingbot/certs
      - ./controllers:/home/hummingbot/controllers
    tty: true
    stdin_open: true
    network_mode: host
    environment:
      - CONFIG_PASSWORD=admin
    working_dir: /home/hummingbot
    command: >
      bash -c "
      mkdir -p conf/connectors conf/strategies conf/controllers conf/scripts &&
      mkdir -p logs data scripts certs &&
      source /opt/conda/etc/profile.d/conda.sh &&
      conda activate hummingbot &&
      python bin/hummingbot.py
      "

      